# Intentionally empty. CHPLConfig/CHPLServiceConfig's messageSource bean uses
# ResourceBundleMessageSource with basename "errors-override" as the primary
# bundle and "errors" (errors.properties) as its parent fallback -
# ResourceBundleMessageSource has no ignore-missing option, so every message
# lookup logs a WARN if this bundle can't be found on the classpath at all.
# This file just needs to exist; no environment has ever put real content in
# it (see errors.properties' own header comment for the override mechanism
# this was originally meant to support at runtime).
